# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Child application documents (photo, birth certificate, previous result,
    # fee-proof) — see docs/parent-application/DESIGN.md §8 item 5.
    applications_directory: '%kernel.project_dir%/public/uploads/applications'
    student_photos_directory: '%kernel.project_dir%/public/uploads/students'
    school_logos_directory: '%kernel.project_dir%/public/uploads/logos'
    proofs_directory: '%kernel.project_dir%/public/uploads/proofs'
    wallet_proofs_directory: '%kernel.project_dir%/public/uploads/wallet_proofs'
    # Expense receipts — private-ish files referenced by the expense register.
    receipts_directory: '%kernel.project_dir%/public/uploads/receipts'
    app.base_domain: "%env(default:default_base_domain:BASE_DOMAIN)%"
    default_base_domain: 'localhost'
    # The domain a school's public site actually answers on (edus.ng), as opposed
    # to BASE_DOMAIN, which is the host this box happens to serve (localhost in
    # development). The Paystack webhook URL printed on /admin/settings/payments
    # must use the public one — `<school>.localhost` would never reach the server.
    # Without this parameter the env fallback cannot resolve and BOTH settings
    # screens threw 500 on load.
    public_domain: "%env(default:public_domain_fallback:PUBLIC_BASE_DOMAIN)%"
    public_domain_fallback: 'edus.ng'

    # Paystack. Empty by default, which is what keeps the app on the local
    # payment simulator — see App\Service\Payment\GatewayFactory. The effective
    # key comes from the landlord settings screen first, then this environment
    # variable (see App\Service\Settings\PlatformSettings); either way it is read
    # at call time, so a key pasted into the admin takes effect immediately.
    paystack_secret_key: "%env(default:paystack_secret_key_fallback:PAYSTACK_SECRET_KEY)%"
    paystack_secret_key_fallback: ''

    # Encrypts the secrets stored in the landlord database (Paystack key, SMTP
    # password). Generate one with: php bin/console app:platform:make-key
    # Deliberately NOT APP_SECRET: rotating the session secret must not make every
    # stored key unreadable.
    app.encryption_key: "%env(default:encryption_key_fallback:APP_ENCRYPTION_KEY)%"
    encryption_key_fallback: ''

    # Edus's own collection account, printed on the payment page and on every
    # invoice PDF. Empty by default ON PURPOSE: the page then says "ask us for
    # transfer details" instead of printing a placeholder account number that
    # nobody can actually pay into. Set EDUS_BANK_* in the server environment.
    app.billing.bank_name: "%env(default:billing_bank_fallback:EDUS_BANK_NAME)%"
    app.billing.bank_account: "%env(default:billing_bank_fallback:EDUS_BANK_ACCOUNT)%"
    app.billing.bank_account_name: "%env(default:billing_bank_fallback:EDUS_BANK_ACCOUNT_NAME)%"
    billing_bank_fallback: ''

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # The class that turns secrets into `enc:v1:…` before they reach the database.
    # The key is a parameter, not a constructor string, so it can be generated and
    # dropped into the server environment without touching this file.
    App\Service\Settings\SecretCipher:
        arguments:
            $appEncryptionKey: '%app.encryption_key%'

    # `MAILER_DSN=platform://default` resolves to this transport, which reads the
    # real DSN from the landlord settings screen on every send.
    App\Service\Mail\PlatformMailerTransportFactory:
        tags: ['mailer.transport_factory']

    # The payment provider is chosen at runtime: Paystack once PAYSTACK_SECRET_KEY
    # is set, otherwise the local simulator. See App\Service\Payment\GatewayFactory.
    App\Service\Payment\PaymentGatewayInterface:
        factory: ['@App\Service\Payment\GatewayFactory', 'create']
