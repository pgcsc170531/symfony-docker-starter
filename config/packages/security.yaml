security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # 1. LANDLORD PROVIDER (Your Super Admin Account)
        app_landlord_provider:
            entity:
                class: App\Entity\Landlord\User
                property: email
                manager_name: landlord # explicit landlord manager

        # 2. AGENT PROVIDER (Resellers/Partners) - NEW ✅
        app_agent_provider:
            entity:
                class: App\Entity\Landlord\Agent
                property: email
                manager_name: landlord # Agents live in the landlord DB

        # 3. TENANT PROVIDER (School Staff)
        #
        # Not the stock `entity:` provider: it compares the email exactly, and a
        # parent whose login is derived from their phone will type the number
        # without the leading zero (8039658200@edus.ng instead of
        # 08039658200@edus.ng). App\Security\TenantUserProvider normalises that
        # before the lookup. Uses the default/tenant manager.
        app_tenant_provider:
            id: App\Security\TenantUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # --- FIREWALL 1: LANDLORD (Super Admin) ---
        landlord:
            pattern: ^/admin
            lazy: true
            provider: app_landlord_provider
            context: landlord_context 
            form_login:
                login_path: app_landlord_login
                check_path: app_landlord_login
                enable_csrf: true
                default_target_path: app_landlord_dashboard
                always_use_default_target_path: true
            logout:
                path: app_landlord_logout
                target: app_landlord_login

        # --- FIREWALL 2: AGENT (Resellers) - NEW ✅ ---
        # Must come BEFORE 'main' because 'main' catches everything
        agent:
            pattern: ^/agent
            lazy: true
            provider: app_agent_provider
            context: agent_context # Keeps Agent session separate from Admin
            form_login:
                login_path: app_agent_login    # We need to create this route
                check_path: app_agent_login
                enable_csrf: true
                default_target_path: app_agent_dashboard # We need to create this route
                always_use_default_target_path: true
            logout:
                path: app_agent_logout         # We need to create this route
                target: app_agent_login

        # --- FIREWALL 3: TENANT (Main App) ---
        main:
            lazy: true
            provider: app_tenant_provider
            context: tenant_context
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_tenant_dashboard
                # Without this Symfony returns the user to the page they first
                # tried to reach — which, for anyone who browsed the school's
                # public site before signing in, is the public site itself. A
                # signed-in administrator always starts at the dashboard, which
                # forwards a brand-new school into onboarding.
                always_use_default_target_path: true
            logout:
                path: app_logout
                target: app_login

    role_hierarchy:
        ROLE_TEACHER:       ROLE_USER
        ROLE_STORE:         ROLE_USER
        ROLE_BURSAR:        ROLE_USER
        ROLE_PARENT:        ROLE_USER

        # The admissions desk. A plain staff seat: it opens /admission and the
        # application queue, and is granted nothing else. It does NOT inherit
        # ROLE_ADMIN, and ROLE_ADMIN does not need it (an administrator is
        # already allowed in).
        ROLE_ADMISSION_OFFICER: ROLE_USER

        # A head of department is a teacher first: without this, an account
        # given ROLE_HOD could not open /my-class or enter results at all.
        ROLE_HOD:           ROLE_TEACHER
        
        ROLE_ADMIN:         [ROLE_BURSAR, ROLE_STORE, ROLE_TEACHER]

        # The school's own overseer — created by its administrator, confined to
        # that school. Inherits every school permission; the dashboard adds the
        # whole-school view on top (see App\Service\Dashboard).
        ROLE_TENANT_SUPER_ADMIN: [ROLE_ADMIN]
        
        # Agent has their own hierarchy
        ROLE_AGENT:         ROLE_USER 

        # Super Admin is god-mode
        ROLE_SUPER_ADMIN:   [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH, ROLE_AGENT]

    access_control:
        # 🟢 1. Landlord (main site) marketing / landing pages — public
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/features, roles: PUBLIC_ACCESS }
        - { path: ^/partners, roles: PUBLIC_ACCESS }
        - { path: ^/manual, roles: PUBLIC_ACCESS }
        # Price list must be readable without an account — it is the page that
        # answers "how much?" before a school ever talks to us.
        - { path: ^/pricing, roles: PUBLIC_ACCESS }

        # Crawlers and WhatsApp's link previewer are anonymous.
        - { path: ^/sitemap\.xml, roles: PUBLIC_ACCESS }
        - { path: ^/robots\.txt, roles: PUBLIC_ACCESS }

        # 🟢 2. Tenant public website pages + the public online-application flow
        #      (parent self-registration, email verification, sign-in links).
        #      Authenticated parent screens live under ^/parent, so this whole
        #      prefix can stay public without any rule-ordering tricks.
        - { path: ^/apply, roles: PUBLIC_ACCESS }
        - { path: ^/about, roles: PUBLIC_ACCESS }
        - { path: ^/admissions, roles: PUBLIC_ACCESS }
        - { path: ^/academics, roles: PUBLIC_ACCESS }
        - { path: ^/events, roles: PUBLIC_ACCESS }
        - { path: ^/contact, roles: PUBLIC_ACCESS }

        # 🟢 2b. Payment-gateway endpoints — must work WITHOUT a session:
        #       • the webhook is called by Paystack's servers (authenticated by
        #         its HMAC signature, not by a session),
        #       • the callback is where the parent's browser lands straight after
        #         paying, possibly in a fresh tab, and it only *asks* the gateway
        #         what happened, and
        #       • the simulated checkout only exists when Paystack is unconfigured.
        #       Nothing here trusts the caller — see SettlementService.
        - { path: ^/payments/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/payments/callback, roles: PUBLIC_ACCESS }
        - { path: ^/payments/fake-checkout, roles: PUBLIC_ACCESS }

        # Edus subscription payments — Paystack calls the webhook with no session,
        # and the callback lands in a fresh tab. Both verify with the gateway and
        # compare the amount before activating anything.
        - { path: ^/subscription/payment/callback, roles: PUBLIC_ACCESS }
        - { path: ^/subscription/payment/webhook, roles: PUBLIC_ACCESS }

        # 🟢 2c. Shared report links — the token IS the credential.
        #       Deliberately public so a grandparent can open it without an account.
        #       The token is random, expires, and is revocable
        #       (docs/results/RESULT-CARD-DESIGN.md §6).
        - { path: ^/r/, roles: PUBLIC_ACCESS }

        # 🟢 2d. Report verification — reached by scanning a QR on a printed card.
        #       Shows that a document is genuine, never the marks.
        - { path: ^/verify/, roles: PUBLIC_ACCESS }

        # 🟢 2e. Shared school-performance PDF — the signed, expiring URL is the
        #       credential. Aggregate figures only, never a pupil's marks.
        - { path: ^/p/performance, roles: PUBLIC_ACCESS }

        # 🟢 2f. Short QR code printed on the performance PDF. The HMAC code is
        #       the credential and stays valid after the share link expires.
        - { path: ^/pv/, roles: PUBLIC_ACCESS }

        # ⚠️ 3. LOGIN PAGES MUST STAY PUBLIC.
        # If these are not public, the firewall denies the login form itself and
        # redirects it back to itself → browser shows ERR_TOO_MANY_REDIRECTS
        # ("This page isn't working") on /admin, /agent and /login.
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/agent/login, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }

        # 🔒 4. Landlord (Super Admin) area
        - { path: ^/admin, roles: ROLE_SUPER_ADMIN }

        # 🔒 5. Partner / Agent portal
        - { path: ^/agent, roles: ROLE_AGENT }

        # Everything else requires login
        - { path: ^/, roles: ROLE_USER }