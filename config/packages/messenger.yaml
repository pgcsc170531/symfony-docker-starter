framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            # Email goes through the queue, never through the web request.
            #
            # A real SMTP relay takes ~7 s per message (measured against Brevo).
            # Releasing a class notifies 67 families, which is ~8 minutes of
            # blocking work — far past PHP's 30 s limit, so the release page died
            # *after* the results had been committed. Queued instead: the release
            # returns at once and a worker sends the notices at the relay's pace.
            #
            # Run the worker:  php bin/console messenger:consume async
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
          #  Symfony\Component\Notifier\Message\ChatMessage: async
         #   Symfony\Component\Notifier\Message\SmsMessage: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async
