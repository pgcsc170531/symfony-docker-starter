<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Edus — School Management Platform · Board Presentation</title>
<style>
  :root{
    --indigo:#4f46e5;
    --indigo-dark:#3730a3;
    --indigo-soft:#eef2ff;
    --amber:#f59e0b;
    --amber-soft:#fef3c7;
    --green:#10b981;
    --green-soft:#d1fae5;
    --red:#ef4444;
    --red-soft:#fee2e2;
    --ink:#1e293b;
    --muted:#64748b;
    --line:#e2e8f0;
    --bg:#f8fafc;
    --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:#0f172a;
    overflow:hidden;
  }

  /* ============ STAGE ============ */
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:44px 48px 84px}

  .slide{
    position:absolute;inset:44px 48px 84px;
    display:none;
    flex-direction:column;
    background:var(--bg);
    border-radius:20px;
    box-shadow:0 30px 60px rgba(0,0,0,.35);
    overflow:hidden;
  }
  .slide.active{display:flex;animation:pop .35s ease}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}

  .slide-body{flex:1;padding:44px 56px;overflow:auto;display:flex;flex-direction:column}
  .slide-body h2{font-size:2rem;line-height:1.15;color:var(--ink);margin-bottom:6px}
  .slide-body h3{font-size:1.15rem;color:var(--indigo);margin:18px 0 6px}
  .slide-body .sub{color:var(--muted);font-size:1.05rem;margin-bottom:16px}
  .kicker{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--indigo);background:var(--indigo-soft);padding:5px 12px;border-radius:999px;margin-bottom:14px;width:fit-content}

  .columns{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}
  @media(max-width:860px){.columns{grid-template-columns:1fr}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .card h4{font-size:1rem;margin-bottom:8px;color:var(--ink)}
  .card p,.card li{color:var(--muted);font-size:.95rem;line-height:1.5}

  ul.tight{list-style:none;margin-top:6px}
  ul.tight li{position:relative;padding-left:22px;margin:8px 0;color:var(--ink);font-size:.98rem;line-height:1.45}
  ul.tight li::before{content:"✓";position:absolute;left:0;top:1px;color:var(--green);font-weight:800}

  .num{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 7px;border-radius:8px;background:var(--indigo-soft);color:var(--indigo);font-weight:800;font-size:.85rem;margin-right:8px}

  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.03em}
  .pill.amber{background:var(--amber-soft);color:#92400e}
  .pill.green{background:var(--green-soft);color:#065f46}
  .pill.red{background:var(--red-soft);color:#991b1b}
  .pill.indigo{background:var(--indigo-soft);color:var(--indigo)}

  .golden{display:inline-flex;align-items:center;gap:8px;background:var(--amber-soft);border:1px solid #fcd34d;color:#92400e;font-weight:700;padding:6px 14px;border-radius:999px;font-size:.85rem;margin-bottom:16px}
  .golden b{color:#b45309}

  /* flow chains */
  .chain{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:16px 0}
  .chain .node{background:var(--card);border:1.5px solid var(--indigo);color:var(--indigo);font-weight:700;padding:12px 14px;border-radius:12px;font-size:.9rem;text-align:center;min-width:96px}
  .chain .node.hot{background:var(--amber-soft);border-color:var(--amber);color:#92400e}
  .chain .arrow{display:flex;align-items:center;color:var(--muted);font-size:1.3rem;font-weight:800}
  .chain .node small{display:block;font-weight:500;color:var(--muted);margin-top:3px;font-size:.72rem}

  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px}
  @media(max-width:860px){.grid3{grid-template-columns:1fr}}

  .big{font-size:1.9rem;font-weight:800;color:var(--indigo)}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
  .stat .v{font-size:1.6rem;font-weight:800;color:var(--ink)}
  .stat .l{color:var(--muted);font-size:.8rem;margin-top:4px}

  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:.92rem}
  th,td{border:1px solid var(--line);padding:9px 12px;text-align:left}
  th{background:var(--indigo-soft);color:var(--indigo);font-weight:700}
  tr:nth-child(even) td{background:#fbfcfe}
  .muted{color:var(--muted)}

  /* ============ DIVIDERS & COVER ============ */
  .slide.dark{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 45%,#4f46e5 100%);color:#fff}
  .slide.dark .slide-body{justify-content:center;text-align:center;align-items:center}
  .slide.dark h2{color:#fff}
  .slide.dark .sub{color:#c7d2fe}
  .slide.dark .kicker{background:rgba(255,255,255,.14);color:#fff}
  .part{font-size:1rem;letter-spacing:.22em;text-transform:uppercase;color:#a5b4fc;font-weight:700;margin-bottom:18px}
  .brand{font-weight:800;font-size:3.4rem;letter-spacing:-.02em;line-height:1.05;margin:8px 0}
  .brand .dot{color:var(--amber)}
  .tagline{color:#c7d2fe;font-size:1.25rem;max-width:720px;line-height:1.6}

  /* ============ HUD ============ */
  .progress{position:fixed;top:0;left:0;height:4px;background:var(--indigo);transition:width .3s;z-index:50}
  .hud{position:fixed;bottom:18px;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 48px;z-index:50}
  .hud .btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:9px 18px;font-size:.9rem;cursor:pointer;font-weight:600;backdrop-filter:blur(6px)}
  .hud .btn:hover{background:rgba(255,255,255,.25)}
  .hud .btn.primary{background:var(--indigo);border-color:var(--indigo)}
  .hud .counter{color:#cbd5e1;font-size:.85rem;font-weight:600}
  .hint{position:fixed;top:14px;right:48px;color:#94a3b8;font-size:.75rem;z-index:50}

  /* notes drawer */
  .notes-drawer{position:fixed;left:0;right:0;bottom:0;transform:translateY(100%);transition:transform .3s ease;background:#0f172a;color:#e2e8f0;border-top:2px solid var(--indigo);z-index:60;max-height:46vh;overflow:auto}
  .notes-drawer.open{transform:translateY(0)}
  .notes-drawer .inner{padding:20px 56px 22px}
  .notes-drawer h4{color:var(--amber);font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px}
  .notes-drawer p{line-height:1.6;font-size:.98rem;color:#cbd5e1;max-width:960px}

  .agenda-list{list-style:none;margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:860px){.agenda-list{grid-template-columns:1fr}}
  .agenda-list li a{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;text-decoration:none;color:var(--ink);font-weight:600;transition:.15s}
  .agenda-list li a:hover{border-color:var(--indigo);transform:translateY(-2px);box-shadow:0 8px 18px rgba(79,70,229,.12)}
  .agenda-list .n{background:var(--indigo);color:#fff;border-radius:8px;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem}
</style>
</head>
<body>

<div class="progress" id="progress"></div>
<div class="hint">← → to navigate &nbsp;·&nbsp; <b>N</b> speaker notes &nbsp;·&nbsp; <b>F</b> fullscreen</div>

<main class="stage" id="stage"></main>

<div class="hud">
  <button class="btn" id="prevBtn" title="Previous">← Back</button>
  <span class="counter" id="counter">1 / 1</span>
  <button class="btn primary" id="nextBtn" title="Next">Next →</button>
</div>

<div class="notes-drawer" id="notesDrawer">
  <div class="inner" id="notesContent"></div>
</div>

<script>
const SLIDES = [
/* 0 COVER */
{ type:'cover', title:'Edus', sub:'School Management Platform', body:`
  <div class="part">Board Presentation</div>
  <div class="brand">Edus<span class="dot">.</span></div>
  <p class="tagline">One portal for the whole school — admissions, academics, fees, store, results and parents.</p>
  <p style="margin-top:22px;color:#a5b4fc;font-size:1rem">A guided walkthrough, told through the journey of one student:
     <b style="color:#fcd34d">Arraghibun</b> (JSS 1A)</p>`,
  notes:`Open with a warm welcome to the board of directors and the principal.
Frame the goal: "Today I will walk you through our school management portal the way the school actually uses it every day."
Introduce the idea of following ONE student — Arraghibun, JSS 1A — from admission all the way to the parent seeing her receipt.
This keeps the whole demonstration connected and easy to follow.` },

/* 1 AGENDA */
{ type:'body', kicker:'Roadmap', title:'What we will cover today', body:`
  <p class="sub">Nine connected steps — each one builds on the one before it. We follow the money and the student end-to-end.</p>
  <ul class="agenda-list">
    <li><a data-go="3"><span class="n">1</span> Login &amp; the big picture</a></li>
    <li><a data-go="5"><span class="n">2</span> Onboarding wizard — setting up the school</a></li>
    <li><a data-go="9"><span class="n">3</span> Academic structure &amp; staff</a></li>
    <li><a data-go="13"><span class="n">4</span> Admissions &amp; students (Arraghibun joins)</a></li>
    <li><a data-go="17"><span class="n">5</span> Finance — billing &amp; payments</a></li>
    <li><a data-go="22"><span class="n">6</span> Store &amp; Point of Sale</a></li>
    <li><a data-go="25"><span class="n">7</span> Expenses &amp; Profit &amp; Loss</a></li>
    <li><a data-go="28"><span class="n">8</span> Results &amp; the approval chain</a></li>
    <li><a data-go="32"><span class="n">9</span> Parent portal, SMS &amp; the full circle</a></li>
  </ul>`,
  notes:`Use this agenda as a roadmap so the board knows exactly where we are heading.
Emphasise the key idea: the modules are NOT separate — they form one continuous flow.
Point out that each of the 9 steps depends on the previous one, which is why the presentation will feel like a single story rather than a list of features.` },

/* 2 DIVIDER 1 */
{ type:'divider', part:'Part 1', title:'Login & the big picture', sub:'What Edus is, and why every school gets its own private space' },

/* 3 LOGIN / PITCH */
{ type:'body', kicker:'Part 1 · Login', title:'One secure portal, private to your school', body:`
  <p class="sub">Each school gets its own <b>isolated database</b> — its data is completely private and separate from every other school on the platform.</p>
  <div class="columns">
    <div class="card">
      <h4>What the school sees</h4>
      <ul class="tight">
        <li>A dedicated web address (your school's own subdomain)</li>
        <li>Secure login with email &amp; password</li>
        <li>Role-based access — Admin, Bursar, Teacher, Store Keeper</li>
        <li>Parents get their own separate login</li>
      </ul>
    </div>
    <div class="card">
      <h4>Why it matters to you</h4>
      <ul class="tight">
        <li>No manual record books or spreadsheets</li>
        <li>Every fee, payment and result is stored safely</li>
        <li>One source of truth for the whole school</li>
        <li>Financial data visible to authorised staff only</li>
      </ul>
    </div>
  </div>
  <div class="chain" style="margin-top:20px">
    <div class="node">Login<span class="pill indigo" style="display:block;margin-top:4px">Role-based</span></div>
    <div class="arrow">→</div>
    <div class="node hot">First-time Setup Wizard<span class="pill amber" style="display:block;margin-top:4px">Automatic</span></div>
  </div>`,
  notes:`Before any live demo, explain the login screen simply: every school has its own private web address and its own private database.
Mention that different staff roles see different parts of the system — the Bursar sees finance, the teacher sees results, the store keeper sees the POS.
Then say: "The first time you log in, the system automatically opens a Setup Wizard — let me show you."` },

/* 4 DIVIDER 2 */
{ type:'divider', part:'Part 2', title:'The Onboarding Wizard', sub:"Five quick steps that build the school's entire foundation" },

/* 5 ONBOARDING 1-2 */
{ type:'body', kicker:'Part 2 · Onboarding', title:'Steps 1–2: Identity & Class Structure', body:`
  <div class="columns">
    <div class="card">
      <h4><span class="num">1</span> School Identity</h4>
      <ul class="tight">
        <li>School name, motto &amp; institution type</li>
        <li>Brand colour &amp; logo (appears on every invoice &amp; receipt)</li>
        <li>Official email, phone &amp; address</li>
      </ul>
    </div>
    <div class="card">
      <h4><span class="num">2</span> Build Class Structure</h4>
      <ul class="tight">
        <li>Tick the levels your school runs (JSS 1 – SS 3)</li>
        <li>Enter the arms as letters: <b>A, B, C</b></li>
        <li>The system auto-generates <b>JSS 1A, JSS 1B, JSS 1C…</b></li>
      </ul>
    </div>
  </div>
  <div class="chain" style="margin-top:14px">
    <div class="node">Levels<span class="pill indigo" style="display:block;margin-top:4px">JSS 1–3</span></div>
    <div class="arrow">+</div>
    <div class="node">Arms<span class="pill indigo" style="display:block;margin-top:4px">A, B, C</span></div>
    <div class="arrow">=</div>
    <div class="node hot">JSS 1A · 1B · 1C …<span class="pill amber" style="display:block;margin-top:4px">auto-created</span></div>
  </div>`,
  notes:`The wizard is the foundation of the whole system — everything else (billing, results, store) hangs off the classes we create here.
Step 1 sets the school's branding, which will automatically appear on every printed invoice and receipt.
Step 2 shows the "smart class generator": type a level and its arms, and the system creates every arm for you. No manual typing of each class.
This is where our demo classes — JSS 1A to JSS 3C — come from.` },

/* 6 ONBOARDING 3-4 */
{ type:'body', kicker:'Part 2 · Onboarding', title:'Steps 3–4: Calendar & Fee Items', body:`
  <div class="columns">
    <div class="card">
      <h4><span class="num">3</span> Academic Calendar</h4>
      <ul class="tight">
        <li>Current session (e.g. 2026/2027)</li>
        <li>Current term (e.g. First Term)</li>
        <li>Resumption &amp; vacation dates</li>
        <li>Only one session / term is "active" at a time</li>
      </ul>
    </div>
    <div class="card">
      <h4><span class="num">4</span> Configure Fee Items</h4>
      <ul class="tight">
        <li>Activate what you charge for (Tuition, PTA Levy…)</li>
        <li>Set frequency: Every Term vs Once per Session</li>
        <li>Set target: All Students vs New Intake Only</li>
        <li>Add custom fee items if needed</li>
      </ul>
    </div>
  </div>
  <p class="muted" style="margin-top:16px"><b>Why this matters:</b> the active session &amp; term determine what every student is billed for, and the fee items are the building blocks of every invoice.</p>`,
  notes:`Step 3 fixes the academic calendar. Note that the system enforces ONE active session and ONE active term — this stops bills and results from being posted to the wrong period.
Step 4 defines the chargeable items. Explain the frequency idea: tuition repeats every term, but an admission form is a one-time charge.
These fee items will be priced per class in the next step.` },

/* 7 ONBOARDING 5 + SUMMARY */
{ type:'body', kicker:'Part 2 · Onboarding', title:'Step 5: Fee Prices → Your Master Fee Schedule', body:`
  <p class="sub">Assign a price to each fee for every class level. New-intake prices can differ from returning-student prices.</p>
  <div class="chain">
    <div class="node">Class<span class="pill indigo" style="display:block;margin-top:4px">JSS 1A</span></div>
    <div class="arrow">×</div>
    <div class="node">Fee Item<span class="pill indigo" style="display:block;margin-top:4px">Tuition</span></div>
    <div class="arrow">=</div>
    <div class="node hot">Fee Structure<span class="pill amber" style="display:block;margin-top:4px">amount per term</span></div>
  </div>
  <div class="card" style="margin-top:10px">
    <h4>Finish → The Master Fee Schedule</h4>
    <p>On completion the portal is live and shows a single fee-schedule matrix — the financial blueprint for the term. The main navigation now reveals the three areas: <b>Academic · Finance · System</b>.</p>
  </div>`,
  notes:`This final wizard step turns the fee items into actual prices per class.
Show the master fee schedule and explain it is the "price list" the system will use automatically when generating bills.
Highlight that the left-hand menu is the school's permanent control centre, organised into Academic, Finance and System.` },

/* 8 DIVIDER 3 */
{ type:'divider', part:'Part 3', title:'Academic Structure & Staff', sub:'Departments, subjects, grading — and the people who run them' },

/* 9 ACADEMIC STRUCTURE */
{ type:'body', kicker:'Part 3 · Structure', title:'Curriculum: Departments → Subjects → Class Subjects', body:`
  <div class="chain">
    <div class="node">Department<span class="pill indigo" style="display:block;margin-top:4px">Sciences</span></div>
    <div class="arrow">→</div>
    <div class="node">Subjects<span class="pill indigo" style="display:block;margin-top:4px">Maths · Physics…</span></div>
    <div class="arrow">→</div>
    <div class="node hot">Class Subjects<span class="pill amber" style="display:block;margin-top:4px">per class, core/elective</span></div>
  </div>
  <div class="columns">
    <div class="card">
      <h4>Why it matters</h4>
      <ul class="tight">
        <li>Each class only sees the subjects it actually offers</li>
        <li>Subjects are tagged <b>core</b> or <b>elective</b></li>
        <li>Sets up teachers, timetables and results entry</li>
      </ul>
    </div>
    <div class="card">
      <h4>Grading scale (configurable)</h4>
      <ul class="tight">
        <li>Define grade bands: A1–F9, WAEC/NECO, or custom</li>
        <li>Score ranges + points + remarks</li>
        <li>Applied consistently to every result</li>
      </ul>
    </div>
  </div>`,
  notes:`Explain the academic backbone: departments group subjects, and class-subjects decide which subject each class offers per session.
Emphasise core vs elective — teachers only ever see the subjects relevant to their class.
Mention the grading scale: the school defines its own grade bands once, and the system uses them everywhere results appear.` },

/* 10 STAFF */
{ type:'body', kicker:'Part 3 · Staff', title:'Staff accounts & the four academic roles', body:`
  <p class="sub">Create staff logins with roles, then assign each staff member to their academic duties in one click.</p>
  <div class="grid3">
    <div class="stat"><div class="v">Form Teacher</div><div class="l">looks after a class in a term</div></div>
    <div class="stat"><div class="v">Subject Teacher</div><div class="l">teaches a subject to a class</div></div>
    <div class="stat"><div class="v">HOD</div><div class="l">heads a department per session</div></div>
    <div class="stat"><div class="v">Year Group Master</div><div class="l">oversees a whole level</div></div>
  </div>
  <p class="muted" style="margin-top:16px"><b>Why this matters:</b> these four roles are the exact same roles used later in the results approval chain — the system already knows who signs off what.</p>`,
  notes:`Staff are created once, then assigned to duties with one click each.
Call out the four roles clearly — Form Teacher, Subject Teacher, HOD and Year Group Master.
Then foreshadow: "Remember these four roles. They are exactly the four levels of our results approval chain later." This is a key connection that makes the demo feel joined-up.` },

/* 11 DIVIDER 4 */
{ type:'divider', part:'Part 4', title:'Admissions & Students', sub:'Bringing students in — and this is where Arraghibun joins' },

/* 12 ADMISSION */
{ type:'body', kicker:'Part 4 · Admissions', title:'New Admission — the "Parent First" flow', body:`
  <span class="golden">Golden thread → <b>Arraghibun Bello</b>, JSS 1A</span>
  <div class="columns">
    <div class="card">
      <h4><span class="num">1</span> Identify the parent</h4>
      <ul class="tight">
        <li>Search existing parents by phone number</li>
        <li>Or register a new parent (with their own login)</li>
        <li>One parent → many children (siblings linked)</li>
      </ul>
    </div>
    <div class="card">
      <h4><span class="num">2</span> Register the student</h4>
      <ul class="tight">
        <li>Identity, DOB, gender</li>
        <li>Class placement</li>
        <li>Origin + medical profile</li>
        <li><b>Admission number auto-generated</b></li>
      </ul>
    </div>
  </div>
  <p class="muted" style="margin-top:14px">We admit <b>Arraghibun</b> here — and from this moment she flows through every other module.</p>`,
  notes:`This is the golden moment — admit Arraghibun Bello into JSS 1A live.
Explain the parent-first architecture: the system links students to a central guardian profile, so one parent with three children sees all of them from a single login.
Point out the auto-generated admission number, and that siblings can be registered without re-entering the parent.` },

/* 13 BULK CSV */
{ type:'body', kicker:'Part 4 · Bulk Import', title:'Bulk import — 360 students in one upload', body:`
  <p class="sub">For the returning cohort we use the CSV importer with our prepared file <b>demo_students_360.csv</b>.</p>
  <div class="grid3">
    <div class="stat"><div class="v">360</div><div class="l">students</div></div>
    <div class="stat"><div class="v">9</div><div class="l">classes (JSS 1A → 3C)</div></div>
    <div class="stat"><div class="v">40</div><div class="l">per class</div></div>
  </div>
  <div class="card" style="margin-top:14px">
    <h4>How it works</h4>
    <ul class="tight">
      <li>Download the 13-column template, fill it, upload it</li>
      <li>Class names are matched automatically (JSS 1A, JSS 1B…)</li>
      <li>Parent accounts are created automatically for every guardian</li>
      <li>Optional: <b>auto-generate invoices</b> for every student in one click</li>
      <li>Blank admission numbers are auto-generated</li>
    </ul>
  </div>`,
  notes:`Switch to bulk mode: show the prepared CSV with 360 students (40 in each of the 9 classes).
Walk through the upload flow and emphasise three wins for the board:
1) parent accounts are created automatically,
2) admission numbers are auto-generated,
3) with one checkbox, every student's invoice is generated at the same time.
This is the "how we migrated the whole school in minutes" moment.` },

/* 14 DIRECTORY */
{ type:'body', kicker:'Part 4 · Directory', title:'Student directory & printed documents', body:`
  <div class="columns">
    <div class="card">
      <h4>Searchable directory</h4>
      <ul class="tight">
        <li>Filter by class or finance status (debtors / cleared)</li>
        <li>Search by name or admission number</li>
        <li>Export the list to Excel</li>
        <li>Quick actions: profile, letter, finance</li>
      </ul>
    </div>
    <div class="card">
      <h4>Professional documents</h4>
      <ul class="tight">

const stage = document.getElementById('stage');
const counter = document.getElementById('counter');
const progress = document.getElementById('progress');
const notesDrawer = document.getElementById('notesDrawer');
const notesContent = document.getElementById('notesContent');

function render(){
  stage.innerHTML = '';
  SLIDES.forEach((s, i) => {
    const sec = document.createElement('section');
    sec.className = 'slide' + (s.type === 'divider' ? ' dark' : '') + (s.type === 'cover' ? ' dark' : '');
    sec.dataset.i = i;
    let inner;
    if (s.type === 'divider') {
      inner = '<div class="part">' + (s.part || '') + '</div>'
            + '<div class="brand">' + (s.title || '') + '</div>'
            + '<p class="tagline">' + (s.sub || '') + '</p>';
    } else {
      inner = (s.kicker ? '<span class="kicker">' + s.kicker + '</span>' : '') + (s.body || '');
    }
    sec.innerHTML = '<div class="slide-body">' + inner + '</div>';
    stage.appendChild(sec);
  });
}
render();

const slides = [...document.querySelectorAll('.slide')];
let current = 0;

function show(i){
  i = Math.max(0, Math.min(SLIDES.length - 1, i));
  slides[current].classList.remove('active');
  current = i;
  slides[current].classList.add('active');
  counter.textContent = (current + 1) + ' / ' + SLIDES.length;
  progress.style.width = ((current + 1) / SLIDES.length * 100) + '%';
  updateNotes();
}
function next(){ show(current + 1); }
function prev(){ show(current - 1); }

function updateNotes(){
  const n = SLIDES[current].notes || '';
  notesContent.innerHTML = '<h4>Speaker notes — ' + (SLIDES[current].title || SLIDES[current].part || '') + '</h4><p>' + n + '</p>';
}

document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  else if (e.key === 'Home') { e.preventDefault(); show(0); }
  else if (e.key === 'End') { e.preventDefault(); show(SLIDES.length - 1); }
  else if (e.key.toLowerCase() === 'n') { notesDrawer.classList.toggle('open'); }
  else if (e.key.toLowerCase() === 'f') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

// agenda links
stage.addEventListener('click', e => {
  const link = e.target.closest('a[data-go]');
  if (link) { e.preventDefault(); show(parseInt(link.dataset.go, 10)); }
});

// notes toggle on click of hint N (keep keyboard too)
document.querySelector('.hint').addEventListener('click', () => notesDrawer.classList.toggle('open'));

show(0);
</script>
