name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/edus-saas:latest

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 1. Move to project directory
            cd /root/projects/symfony-docker-starter
            
            # 2. Pull the new image we just built
            docker compose pull php
            
            # 3. Restart containers with the new image
            docker compose up -d
            
            # 4. Update the LANDLORD database (The main one for schools/users)
            docker compose exec -T php bin/console doctrine:migrations:migrate --no-interaction --em=landlord
            
            # 5. Clear production cache
            docker compose exec -T php bin/console cache:clear