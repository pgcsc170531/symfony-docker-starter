name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/edus-saas:latest

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/projects
            export TERMII_API_KEY=${{ secrets.TERMII_API_KEY }}
            
            docker compose pull
            docker compose up -d --force-recreate
            
            # --- THE FIX: WAIT FOR DATABASE ---
            echo "Waiting for database to be ready..."
            sleep 10
            
            # Now run migrations
            docker compose exec -e APP_ENV=prod -T php bin/console doctrine:migrations:migrate --no-interaction --em=landlord || true
            
            # Clear and warm up cache
            docker compose exec -e APP_ENV=prod -T php bin/console cache:clear --no-warmup
            docker compose exec -e APP_ENV=prod -T php bin/console cache:warmup
            
           