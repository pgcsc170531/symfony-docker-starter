name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    # Changed from ubuntu-latest to clear the migration warning
    runs-on: ubuntu-24.04 
    
    steps:
      - name: Checkout Code
        # Bumped to v5 to clear Node.js 20 deprecation warning
        uses: actions/checkout@v5 

      - name: Login to Docker Hub
        # Bumped to v4 to clear Node.js 20 deprecation warning
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        # Bumped to v6 to clear Node.js 20 deprecation warning
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/edus-saas:latest

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/projects
            export TERMII_API_KEY=${{ secrets.TERMII_API_KEY }}

            # ── Secrets that must reach the app ───────────────────────────────
            # `.env.local` is gitignored on purpose, and the compose file mounts
            # `./:/app`, so THIS file on the VPS *is* the app's `.env.local`.
            # Anything written here survives deploys and needs no rebuild.
            #
            # Written from GitHub Secrets so a key can be rotated in one place
            # instead of by SSH-ing into the box. Empty secrets are skipped, which
            # means "leave whatever the server already has".
            #
            # Upsert without sed escaping (a DSN can contain |, &, #):
            set_kv() {
              key="$1"; value="$2"; file="/root/projects/.env.local"
              [ -z "$value" ] && return 0
              touch "$file"; chmod 600 "$file"
              grep -v "^${key}=" "$file" > "${file}.tmp" 2>/dev/null || true
              printf '%s="%s"\n' "$key" "$value" >> "${file}.tmp"
              mv "${file}.tmp" "$file"
            }

            set_kv PAYSTACK_SECRET_KEY     '${{ secrets.PAYSTACK_SECRET_KEY }}'
            set_kv PAYSTACK_PUBLIC_KEY     '${{ secrets.PAYSTACK_PUBLIC_KEY }}'
            set_kv MAILER_DSN              '${{ secrets.MAILER_DSN }}'
            set_kv BREVO_SMTP_LOGIN        '${{ secrets.BREVO_SMTP_LOGIN }}'
            set_kv BREVO_SMTP_KEY          '${{ secrets.BREVO_SMTP_KEY }}'
            set_kv MAILER_FROM             '${{ secrets.MAILER_FROM }}'
            set_kv MAILER_REPLY_TO         '${{ secrets.MAILER_REPLY_TO }}'

            # APP_SECRET signs sessions and CSRF tokens — it is not an encryption
            # key. Production will not boot with an empty kernel.secret
            # ("A non-empty value for the parameter kernel.secret is required"),
            # and nothing in .env / compose.yaml supplies one, so it has to come
            # from here. Rotating it only logs everyone out.
            set_kv APP_SECRET              '${{ secrets.APP_SECRET }}'

            # ⚠ APP_ENCRYPTION_KEY must never change once secrets are stored in the
            # landlord database: it decrypts them. Set only if the server has none.
            if ! grep -q '^APP_ENCRYPTION_KEY=' /root/projects/.env.local 2>/dev/null; then
              set_kv APP_ENCRYPTION_KEY '${{ secrets.APP_ENCRYPTION_KEY }}'
            fi

            # Pass the variable directly so the warning disappears
            TERMII_API_KEY=$TERMII_API_KEY docker compose pull
            TERMII_API_KEY=$TERMII_API_KEY docker compose up -d --force-recreate
            
            # ⏱️ Give MySQL 15 seconds to boot before running schema updates
            sleep 15
            
            # Run your Landlord and Tenant updates
            docker compose exec -e APP_ENV=prod -T php bin/console app:landlord:update-schema
            docker compose exec -e APP_ENV=prod -T php bin/console app:tenant:update-schema
            
            # Final cache wipe
            docker compose exec -e APP_ENV=prod -T php bin/console cache:clear