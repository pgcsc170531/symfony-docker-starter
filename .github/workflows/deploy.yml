name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    # Changed from ubuntu-latest to clear the migration warning
    runs-on: ubuntu-24.04 
    
    steps:
      - name: Checkout Code
        # Bumped to v5 to clear Node.js 20 deprecation warning
        uses: actions/checkout@v5 

      - name: Login to Docker Hub
        # Bumped to v4 to clear Node.js 20 deprecation warning
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push ARM64 Docker Image
        # The Oracle Ampere instance runs ARM64; build the image for that platform.
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          # Baked into the image and shown by /health, so the running commit can
          # be checked from anywhere without shell access.
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/edus-saas:latest

      - name: Deploy to Oracle ARM64 instance via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/projects
            export TERMII_API_KEY=${{ secrets.TERMII_API_KEY }}

            # ── Secrets that must reach the app ───────────────────────────────
            # `.env.local` is gitignored on purpose, and the compose file mounts
            # `./:/app`, so THIS file on the VPS *is* the app's `.env.local`.
            # Anything written here survives deploys and needs no rebuild.
            #
            # Written from GitHub Secrets so a key can be rotated in one place
            # instead of by SSH-ing into the box. Empty secrets are skipped, which
            # means "leave whatever the server already has".
            #
            # Upsert without sed escaping (a DSN can contain |, &, #):
            set_kv() {
              key="$1"; value="$2"; file="/root/projects/.env.local"
              [ -z "$value" ] && return 0
              touch "$file"; chmod 600 "$file"
              grep -v "^${key}=" "$file" > "${file}.tmp" 2>/dev/null || true
              printf '%s="%s"\n' "$key" "$value" >> "${file}.tmp"
              mv "${file}.tmp" "$file"
            }

            set_kv PAYSTACK_SECRET_KEY     '${{ secrets.PAYSTACK_SECRET_KEY }}'
            set_kv PAYSTACK_PUBLIC_KEY     '${{ secrets.PAYSTACK_PUBLIC_KEY }}'
            set_kv MAILER_DSN              '${{ secrets.MAILER_DSN }}'
            set_kv BREVO_SMTP_LOGIN        '${{ secrets.BREVO_SMTP_LOGIN }}'
            set_kv BREVO_SMTP_KEY          '${{ secrets.BREVO_SMTP_KEY }}'
            set_kv MAILER_FROM             '${{ secrets.MAILER_FROM }}'
            set_kv MAILER_REPLY_TO         '${{ secrets.MAILER_REPLY_TO }}'

            # APP_SECRET signs sessions and CSRF tokens — it is not an encryption
            # key. Production will not boot with an empty kernel.secret
            # ("A non-empty value for the parameter kernel.secret is required"),
            # and nothing in .env / compose.yaml supplies one, so it has to come
            # from here. Rotating it only logs everyone out.
            set_kv APP_SECRET              '${{ secrets.APP_SECRET }}'

            # ⚠ APP_ENCRYPTION_KEY must never change once secrets are stored in the
            # landlord database: it decrypts them. Set only if the server has none.
            if ! grep -q '^APP_ENCRYPTION_KEY=' /root/projects/.env.local 2>/dev/null; then
              set_kv APP_ENCRYPTION_KEY '${{ secrets.APP_ENCRYPTION_KEY }}'
            fi

            # Pass the variable directly so the warning disappears
            TERMII_API_KEY=$TERMII_API_KEY docker compose pull

            # ── Update the directory the container actually runs ───────────────
            # compose.yaml mounts `./:/app`, so the container serves THIS
            # checkout, not the image the workflow just built. Pulling the image
            # alone changes nothing: the mount shadows it, and the deploy still
            # reports success (2026-11-08 — the admission-numbers menu was
            # invisible after two green deploys).
            #
            # The target host has no `git` installed, which is why the first
            # attempt at this step failed with "git: command not found" and
            # changed nothing. So: use git when it is there, and otherwise copy
            # the built application straight out of the image we just pulled.
            # Server-owned files (.env.local, compose.yaml, uploads, var/) are
            # not in the image, so they survive either path.
            if command -v git >/dev/null 2>&1 && [ -d .git ]; then
              git fetch --prune origin
              git reset --hard origin/main
              echo "Deploying commit: $(git log --oneline -1)"
            else
              echo "git not available here - syncing the checkout from the image"
              docker run --rm -v /root/projects:/target \
                --entrypoint sh "${{ secrets.DOCKERHUB_USERNAME }}/edus-saas:latest" \
                -c 'cp -a /app/. /target/'
              echo "Synced from image: ${{ secrets.DOCKERHUB_USERNAME }}/edus-saas:latest"
            fi

            # Bring the application up WITHOUT its dependencies.
            #
            # `--no-deps` is deliberate: this host also runs Azuracast, which
            # already owns ports 8025/8080/443. Plain `up` therefore fails on the
            # Mailpit sidecar ("Bind for 0.0.0.0:8025 failed: port is already
            # allocated") and CANCELS php, which depends_on it — the school
            # portal went down that way on 2026-11-08. A dev inbox must never be
            # able to take the school offline.
            TERMII_API_KEY=$TERMII_API_KEY docker compose up -d --force-recreate --no-deps php database phpmyadmin

            # Try the mailer too, but never fail the deploy over it: real mail
            # goes through MAILER_DSN (Brevo), set in .env.local above.
            TERMII_API_KEY=$TERMII_API_KEY docker compose up -d mailer \
              || echo "mailer not started (host port in use?) - the app is unaffected"
            
            # ⏱️ Give MySQL 15 seconds to boot before running schema updates
            sleep 15
            
            # Run your Landlord and Tenant updates
            docker compose exec -e APP_ENV=prod -T php bin/console app:landlord:update-schema
            docker compose exec -e APP_ENV=prod -T php bin/console app:tenant:update-schema

            # 💰 Prices live in the landlord `plan` table, not in code alone.
            # /pricing reads App\Service\Pricing\PricingCatalog, but quotes,
            # invoices and /admin/plan read Plan::getImplementationFee() — so a
            # changed price used to deploy in the code and never reach billing.
            # Idempotent: refreshes Standard + Enterprise, never deletes a plan.
            docker compose exec -e APP_ENV=prod -T php bin/console app:landlord:seed-plans
            
            # 🧹 Final cache wipe.
            #
            # `cache:clear` deletes var/cache/prod file-by-file and then rmdirs it.
            # On this setup the directory is a bind mount shared with the freshly
            # recreated FrankenPHP worker, so the rmdir loses the race and fails
            # with "Failed to remove directory /app/var/cache/prod". The deploy
            # then exits 1 with the app left on a HALF-BUILT cache — which is what
            # took the site down on 2026-10-24. Remove the directory outright
            # (we run as root) and rebuild it in one pass instead.
            docker compose exec -e APP_ENV=prod -T php rm -rf var/cache/prod
            docker compose exec -e APP_ENV=prod -T php bin/console cache:warmup
            # var/log does not always exist on the bind mount — create it rather
            # than letting `chown` fail the whole deploy.
            docker compose exec -T php sh -c 'mkdir -p var/log && chown -R www-data:www-data var/cache var/log'

            # 🌍 Geography for admission (Country → State of origin → LGA).
            #
            # The admission and parent-application forms render those three as
            # entity dropdowns, so a tenant without the rows has three empty
            # selects. Idempotent — it only inserts what a tenant is missing —
            # so it is safe on every deploy and heals schools provisioned before
            # the seeding step existed.
            #
            # Runs AFTER the cache wipe on purpose: this command is new, and the
            # container Symfony boots from must have been rebuilt from these
            # sources, or it would answer "command is not defined".
            docker compose exec -e APP_ENV=prod -T php bin/console app:tenant:seed-nigeria

            # 🧽 Old image generations are what filled the 30 GB boot volume on
            # 2026-11-08 ("no space left on device" mid-pull). Keep only layers
            # nothing references; `prune` without `-a` never removes a tagged
            # image in use, and never touches volumes (the databases).
            docker image prune -f >/dev/null 2>&1 || true
            df -h / | tail -1

